name: Tests

# Pull requests only; pushes to main are tested by the deploy workflow before deploying.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run --frozen pytest -q
