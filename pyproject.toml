[project]
name = "hardcover-wrapups"
version = "0.1.0"
description = "Monthly cover-collage wrap-ups of the books you finished, from your Hardcover library."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.2",
    "httpx>=0.28",
    "jinja2>=3.1.6",
    "pillow>=11",
    "python-multipart>=0.0.32",
    "starlette>=0.47",
    "uvicorn>=0.35",
]

[project.scripts]
hc-wrapup = "hardcover_wrapups.cli:main"
hc-wrapup-web = "hardcover_wrapups.web:serve"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
