<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hardcover Wrap-Ups{% endblock %}</title>
  <meta name="description" content="Make a cover-collage image of the books you finished this month, from your Hardcover library.">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/static/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Hardcover Wrap-Ups</a>
    {% if session %}
    <form class="signout" method="post" action="/logout">
      <input type="hidden" name="csrf" value="{{ session.csrf }}">
      <span class="who">Signed in as {{ session.username or "you" }}</span>
      <button type="submit" class="link-button">Sign out</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Hardcover Wrap-Ups was <strong>not</strong> made by Hardcover. (If it was, it would probably be in their app, wouldn't it?)</p>
    <p><a href="/privacy">Privacy and Terms</a> ·
       <a href="https://github.com/bibliocholy-enjoyer/hardcover-wrapups">Source code</a></p>
  </footer>
</body>
</html>
